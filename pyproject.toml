[build-system]
requires = ["poetry-core>=1.2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "kallistomanager"
version = "0.2.0"
description = "Analysis of kallisto outputs"
authors = ["Lisa Fournier <lisa.fournier@unibe.ch>"]
readme = "README.md"
repository = "https://github.com/AI-for-RNA-Biology/kallistomanager"
license = "GPL-3.0-only"
packages = [{include = "kallistomanager"}] # editable mode

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.23.4"
pandas = "^1.5.1"
scanpy = "^1.9.1"
scikit-learn = "^1.1.3"
matplotlib = {version = "^3.7.3", optional = true}
gtfparse = "^1.2.1"
anndata = "^0.9.2"

[tool.poetry.group.dev.dependencies]
bandit = "^1.7.4"
black = "^22.10.0"
coverage = "^6.5.0"
flake8 = "^5.0.4"
pre-commit = "^2.20.0"
pytest = "^7.2.0"
pytest-mock = "^3.10.0"
click = "^8.1.3"
reuse = "^2.1.0"

[tool.poetry.extras]
plot = ["matplotlib"]
